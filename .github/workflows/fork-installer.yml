name: Build installer (fork only)

# 只在这个 fork 上产出可安装的安装包，用于实机体验未合并的改动。
#
# 与 .github/workflows/release.yml 的区别（刻意为之）：
# - 不创建、不发布任何 GitHub Release，只在 run 里上传 artifact。所以不消耗签名额度、不对外公开。
# - 不签名。产物带 -unsigned 后缀，uiAccess 因此不生效（候选窗盖不住提权窗口），但行序、候选、
#   上下键这些要验证的行为与签名版一致。
# - 不做 release-please、不合并 PR、不碰 main 的版本序列。
# - 全流程跑在 GitHub 托管的 windows-2025 上，不依赖上游的自托管 runner。
#
# 上游仓库 metasequoiaime/MSIME-Windows 完全不受影响：这个文件只存在于 fork 里。

on:
  workflow_dispatch:
    inputs:
      product_version:
        description: 打进安装包与版本资源的版本号，必须 MAJOR.MINOR.PATCH（只影响显示，不动 version.txt）
        required: false
        default: '0.11.2'
        type: string
      include_symbols:
        description: 把 PDB 一起打进安装包（体积增加约 140MB）
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: fork-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsf:
    name: TSF ${{ matrix.name }}
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            architecture: x64
            triplet: x64-windows-static
            build_dir: windows/build64-release
          - name: Win32
            architecture: Win32
            triplet: x86-windows-static
            build_dir: windows/build32-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Stamp the version resource
        shell: pwsh
        env:
          TARGET_VERSION: ${{ inputs.product_version }}
        run: |
          python scripts/apply_version.py --version $env:TARGET_VERSION
          python scripts/apply_version.py --version $env:TARGET_VERSION --check

      # 与 ci.yml 的 TSF job 共用同一个 vcpkg 缓存 scope，省掉冷装依赖的时间。
      - name: Restore dependency binaries
        id: vcpkg-cache
        uses: ./.github/actions/vcpkg-cache
        with:
          scope: tip-${{ matrix.triplet }}

      - name: Install dependencies
        shell: pwsh
        working-directory: windows
        run: vcpkg install --triplet ${{ matrix.triplet }}

      - name: Save dependency binaries before compiling
        if: steps.vcpkg-cache.outputs.matched-key != format('{0}-complete', steps.vcpkg-cache.outputs.key)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg-cache.outputs.path }}
          key: ${{ steps.vcpkg-cache.outputs.key }}-complete

      - name: Configure
        shell: pwsh
        run: >
          cmake -S windows -B ${{ matrix.build_dir }} -A ${{ matrix.architecture }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

      - name: Build
        shell: pwsh
        run: cmake --build ${{ matrix.build_dir }} --config Release --parallel

      - name: Check the TSF binary and symbols the installer expects
        shell: pwsh
        run: ./scripts/ci/check-tsf-dll.ps1 -BuildDir '${{ matrix.build_dir }}'

      - name: Upload the TSF binary and symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsf-${{ matrix.name }}
          path: ${{ matrix.build_dir }}/Release
          if-no-files-found: error

  server:
    name: Build Server
    runs-on: windows-2025
    timeout-minutes: 120
    env:
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Stamp the version resource
        shell: pwsh
        env:
          TARGET_VERSION: ${{ inputs.product_version }}
        run: |
          python scripts/apply_version.py --version $env:TARGET_VERSION
          python scripts/apply_version.py --version $env:TARGET_VERSION --check

      - name: Restore dependency binaries
        id: vcpkg-cache
        uses: ./.github/actions/vcpkg-cache
        with:
          scope: server-x64-windows-and-static-md

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Set up sccache
        id: sccache
        continue-on-error: true
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install Boost
        shell: pwsh
        run: ./scripts/ci/install-boost.ps1

      - name: Save Boost binaries before configuring
        if: steps.vcpkg-cache.outputs.matched-key != format('{0}-complete', steps.vcpkg-cache.outputs.key) && steps.vcpkg-cache.outputs.matched-key != format('{0}-boost', steps.vcpkg-cache.outputs.key)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg-cache.outputs.path }}
          key: ${{ steps.vcpkg-cache.outputs.key }}-boost

      # Ninja Multi-Config：sccache 通过 CMAKE_<LANG>_COMPILER_LAUNCHER 接入，VS 生成器不支持；
      # 同时保留 --config Release / bin/Release 的目录布局，打包脚本依赖它。
      - name: Configure
        shell: pwsh
        run: |
          $cmakeArgs = @(
            '-S', 'server', '-B', 'server/build-release', '-G', 'Ninja Multi-Config',
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake",
            '-DVCPKG_TARGET_TRIPLET=x64-windows',
            '-DMSIME_PRODUCT_VERSION_OVERRIDE=${{ inputs.product_version }}'
          )
          $cmakeArgs += @(./scripts/ci/cmake-sccache-args.ps1 -SetupOutcome '${{ steps.sccache.outcome }}')
          cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save dependency binaries before compiling
        if: steps.vcpkg-cache.outputs.matched-key != format('{0}-complete', steps.vcpkg-cache.outputs.key)
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.vcpkg-cache.outputs.path }}
          key: ${{ steps.vcpkg-cache.outputs.key }}-complete

      - name: Build
        shell: pwsh
        run: cmake --build server/build-release --config Release --parallel

      # 刻意不嵌 uiAccess manifest。uiAccess="true" 的进程必须「有效签名 + 装在受信任位置」
      # 才能启动；未签名时 Windows 直接拒绝启动 Server（不是降级），现象就是能切输入法、
      # 但完全没有候选窗。本 workflow 不签名，所以保持构建出来的普通 asInvoker 清单。
      # 代价：候选窗盖不住提权窗口；普通宿主（记事本、浏览器、Office）不受影响。
      - name: Check the binaries the installer requires
        shell: pwsh
        run: ./scripts/ci/check-server-binaries.ps1 -BuildDir server/build-release/bin/Release

      - name: Upload the Server build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server
          path: server/build-release/bin/Release
          if-no-files-found: error

  package:
    name: Package installer (unsigned)
    needs: [tsf, server]
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      STAGING_ROOT: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stamp the version resource
        shell: pwsh
        env:
          TARGET_VERSION: ${{ inputs.product_version }}
        run: |
          python scripts/apply_version.py --version $env:TARGET_VERSION
          python scripts/apply_version.py --version $env:TARGET_VERSION --check

      - name: Download the x64 TSF binary and symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tsf-x64
          path: windows/build64-release/Release

      - name: Download the 32-bit TSF binary and symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tsf-Win32
          path: windows/build32-release/Release

      - name: Download the Server build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server
          path: server/build-release/bin/Release

      # 词库来自产品锁钉住的公开 release，逐个核对 SHA256。
      - name: Download the dictionaries
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/download-dictionaries.sh

      # sc.lm 由 lock.json 钉住的 libime 语料在本地转换，下载与产物摘要都校验。
      - name: Build the word-lattice language model
        shell: pwsh
        run: ./scripts/build-language-model.ps1

      - name: Download the neural sentence models
        shell: pwsh
        run: ./scripts/fetch-neural-model.ps1

      # 不配任何签名：产物名带 -unsigned，uiAccess 不生效。这是本 workflow 的刻意选择，
      # 免得 fork 里的构建消耗上游证书额度或需要 SignPath 审批。
      - name: Decide the signing mode
        id: signing
        shell: pwsh
        env:
          SIGNING_PROVIDER: none-forced
          # 显式清空，防止 fork 里误配的变量把流程带进签名分支。
          CERTIFICATE_BASE64: ''
          CERTIFICATE_PASSWORD: ''
          CERTIFICATE_THUMBPRINT: ''
        run: |
          "signing_enabled=false" >> $env:GITHUB_OUTPUT
          "signing_provider=none" >> $env:GITHUB_OUTPUT
          "asset_suffix=-unsigned" >> $env:GITHUB_OUTPUT
          Write-Host 'Fork build: publishing an unsigned installer, no signature is spent.'

      - name: Collect the installer payload
        shell: pwsh
        working-directory: installer
        env:
          TARGET_VERSION: ${{ inputs.product_version }}
        run: >
          pwsh -File ./Prepare-PackageFiles.ps1 -TargetVersion $env:TARGET_VERSION
          -RepoRoot (Resolve-Path '..').Path
          -TsfDirectory windows -ServerDirectory server -NoticesDirectory .
          -HelpCodeDirectory engine/helpcode -IncludeSymbols:${{ inputs.include_symbols }}

      - name: Embed the exact product dependency manifest
        env:
          WINDOWS_COMMIT: ${{ github.sha }}
        run: >
          python scripts/product_lock.py manifest
          --windows-commit "$env:WINDOWS_COMMIT"
          --output installer/app_data/product-manifest.json

      # fork 包把诊断日志默认打开：候选窗的翻面判定、行序、上下键偏移都记在
      # 桌面「水杉IME诊断日志.log」里。只改这份 fork 包里的出厂配置，不动仓库里的模板。
      - name: Enable diagnostic logging in this fork build
        shell: pwsh
        run: |
          $path = 'installer/app_data/config.default.toml'
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "缺少出厂配置：$path"
          }
          $text = Get-Content -LiteralPath $path -Raw
          $text = $text -replace '(?m)^diagnostic_log\s*=\s*false\s*$', 'diagnostic_log = true'
          $text = $text -replace '(?m)^tsf_diagnostic_log\s*=\s*false\s*$', 'tsf_diagnostic_log = true'
          $text = $text -replace '(?m)^candidate_window_diagnostic_log\s*=\s*false\s*$', 'candidate_window_diagnostic_log = true'
          Set-Content -LiteralPath $path -Value $text -NoNewline -Encoding utf8
          if ($text -notmatch '(?m)^diagnostic_log\s*=\s*true\s*$') {
            throw '未能打开 diagnostic_log，出厂配置格式可能变了。'
          }
          Write-Host 'diagnostic_log / tsf_diagnostic_log / candidate_window_diagnostic_log 已在该包内打开。'

      - name: Install the Chinese language file for Inno Setup
        shell: pwsh
        run: ./scripts/ci/install-inno-language.ps1

      - name: Compile the installer
        shell: pwsh
        working-directory: installer
        run: pwsh -File ./Compile-Installer.ps1

      # Prepare-PackageFiles.ps1 已把 -TargetVersion 写进 iss 的 MyAppVersion，
      # 所以产物名就是 MetasequoiaIME_Setup_v<版本>.exe；这里只校验存在并算摘要。
      - name: Name the installer asset
        id: asset
        shell: pwsh
        env:
          TARGET_VERSION: ${{ inputs.product_version }}
        run: |
          # 产物名由 iss 的 OutputBaseFilename 决定（Prepare-PackageFiles.ps1 已把
          # -TargetVersion 写进 MyAppVersion）。本 workflow 不签名，所以不带额外后缀。
          # 递归找，别拼路径：ISCC 的 OutputDir 是相对 iss 所在目录的，工作目录一变就找不到。
          $found = @(Get-ChildItem -LiteralPath '.' -Recurse -File -Filter 'MetasequoiaIME_Setup_v*.exe' -ErrorAction SilentlyContinue)
          if ($found.Count -ne 1) {
            $listing = ($found | Select-Object -ExpandProperty FullName) -join ', '
            throw "应恰好一个安装包，实际 $($found.Count) 个：$listing"
          }
          $path = $found[0].FullName
          $name = $found[0].Name
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLower()
          $bytes = (Get-Item -LiteralPath $path).Length
          "installer_path=$path" >> $env:GITHUB_OUTPUT
          "installer_name=$name" >> $env:GITHUB_OUTPUT
          "installer_sha256=$hash" >> $env:GITHUB_OUTPUT
          "installer_bytes=$bytes" >> $env:GITHUB_OUTPUT
          Write-Host "installer=$name sha256=$hash bytes=$bytes"

      - name: Upload the installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MetasequoiaIME-fork-installer
          path: ${{ steps.asset.outputs.installer_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        shell: pwsh
        env:
          NAME: ${{ steps.asset.outputs.installer_name }}
          SHA256: ${{ steps.asset.outputs.installer_sha256 }}
          BYTES: ${{ steps.asset.outputs.installer_bytes }}
        run: |
          @"
          ### 安装包已生成

          - 文件：``$env:NAME``
          - SHA256：``$env:SHA256``
          - 大小：$env:BYTES 字节
          - 签名：**未签名**（`-unsigned`）。`uiAccess` 不生效，候选窗盖不住提权窗口；行序与上下键行为与签名版一致。

          下载：本 run 页面底部 Artifacts → ``MetasequoiaIME-fork-installer``。
          "@ >> $env:GITHUB_STEP_SUMMARY
